[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-data-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx[brotli]>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "pymupdf>=1.24",
    "apscheduler>=3.10",
    "pdfplumber>=0.11",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",          # XLSX feeds (unsolicited-messages watchlist)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional: enables the Redis-backed dedup hot-set (storage/cache.py).
# Without it, main.py falls back to the in-process MemoryDedupCache.
redis = ["redis>=5.0"]
# Optional: the web dashboard + API (nse_data.api.server:app).
dashboard = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# Optional: broker historical intraday backfill (brokers/groww.py, brokers/kite.py,
# brokers/angel.py). smartapi-python is Angel One's SmartAPI SDK (the default
# --source for backfill_groww_full.py).
broker = ["growwapi>=0.1", "pyotp>=2.9", "kiteconnect>=4.2", "smartapi-python>=1.5"]
# Optional: technical indicators nightly compute (indicators/*). pandas-ta-classic
# is the maintained pandas-ta fork that's compatible with numpy 2.x.
indicators = ["pandas>=2.0,<3", "pandas-ta-classic>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"