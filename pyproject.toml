[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-data-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx[brotli]>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "pymupdf>=1.24",
    "apscheduler>=3.10",
    "pdfplumber>=0.11",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"