# Per-feature on/off toggles for collectors/jobs added during the 25-Jun post-mortem build.
# Missing file or missing key → feature defaults ON (see _feature_enabled / loaders).
# Flip to false to disable without a code change + redeploy.
features:
  # Task 4 — forward events calendar
  events_extended:      true   # ingest non-results board catalysts, ex-dates, manual overrides
  pre_event_promotion:  true   # add stocks with an event in next 1-3 trading days to watchlist
  # Task 5 — news long-tail coverage
  move_triggered_news:  true   # >5% intraday move → retroactively pull news into the corpus
  # Task 2 — macro-theme / basket-rotation detector
  basket_rotation:      true   # detect correlated sector baskets + promote members (swing)
  # Task 3 — isolated small-cap EOD momentum track (paper-only)
  smallcap_momentum:    true   # EOD small-cap signals + universe_gaps logging (isolated)
  # V2 signal expansion
  large_deal_signals:   true   # P2: entity-classify bulk/block deals (FII/MF/insurance)
  promoter_signals:     true   # P3: insider/promoter buy-strong/sustained/pledge classification
  signal_paper:         true   # forward-validation paper tracks for deal_flow + promoter_flow
  desk_note:            true   # LLM daily desk-analyst note over the signal tables (cap-bounded)
  fpi_flow:             true   # market-level FPI flow-regime (risk-on/off) from NSDL custody feed
  fpi_sector:           true   # true FPI SECTOR rotation from NSDL fortnightly sector report
  fpi_short_paper:      true   # forward-paper: short FPI-headwind names with uptrend still intact
  paper_review:         true   # weekly per-strategy realized-stats review (alerts only when >=20 closed)
  annual_financials:    true   # parse audited annual filings → annual_financials (Piotroski basis)
