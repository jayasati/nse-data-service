option_chain:
  # type → list of symbols. The collector fetches each as a separate call.
  # Start small. Each symbol = 2 HTTP calls (expiry + chain) at 5-min cadence.
  # 4 symbols × 2 calls = 8 fetches per 5-min cycle. Comfortable for rate limiter.
  indices:
    - NIFTY
    - BANKNIFTY
    - FINNIFTY
  # Top-50 F&O equities by turnover — for Phase-4 max-pain / PCR / GEX / OI walls.
  equities:
    - HDFCBANK
    - ICICIBANK
    - RELIANCE
    - BSE
    - BHARTIARTL
    - SBIN
    - ETERNAL
    - TCS
    - M&M
    - AXISBANK
    - LT
    - BAJFINANCE
    - VEDL
    - KOTAKBANK
    - MCX
    - IDEA
    - BEL
    - DIXON
    - MARUTI
    - ITC
    - INDIGO
    - HAL
    - SHRIRAMFIN
    - TATASTEEL
    - HINDALCO
    - HCLTECH
    - SUNPHARMA
    - TRENT
    - JIOFIN
    - HINDUNILVR
    - NTPC
    - MAZDOCK
    - PAYTM
    - CANBK
    - SUZLON
    - POWERGRID
    - ADANIPOWER
    - EICHERMOT
    - BAJAJ-AUTO
    - TITAN
    - COFORGE
    - ADANIPORTS
    - HINDZINC
    - HEROMOTOCO
    - ULTRACEMCO
    - ADANIENT
    - DMART
    - LUPIN
    - PRESTIGE
    - CAMS

  # How many expiries to fetch per symbol. 1 = nearest only (cheapest, covers PCR
  # and max-pain). 2 = near + next month, needed for the IV term-structure factor
  # (near ATM IV vs far ATM IV → contango/backwardation).
  n_expiries: 2


index_members:
  # Indices whose constituent lists we capture weekly. Each entry triggers one
  # HTTP fan-out call. ReferenceCollector with diff_upsert tracks rebalances
  # (rare but happen every ~6 months when NSE reconstitutes indices).
  indices:
    - NIFTY 50
    - NIFTY 100
    - NIFTY 500
    - NIFTY BANK
    - NIFTY IT
    - NIFTY AUTO
    - NIFTY PHARMA
    - NIFTY FMCG
    - NIFTY FINANCIAL SERVICES
    - NIFTY ENERGY
    - NIFTY METAL
    - NIFTY REALTY


watchlist:
  # Symbols we want full per-stock attention on. Used by quote_metadata
  # (fan-out per symbol weekly) and any future per-stock signal collectors.
  # The F&O list (~209 symbols) automatically gets included by quote_metadata;
  # this list is for stocks you specifically care about beyond the F&O default.
  - RELIANCE
  - TCS
  - HDFCBANK
  - INFY
  - ICICIBANK