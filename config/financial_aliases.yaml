# Financial extractor config (Week 17 vision-first rewrite).
#
# The vision model reads the P&L straight from page images, so we no longer keep
# per-field row-label alias lists here. What remains is the small amount of
# deterministic knowledge the orchestrator still needs:
#   * canonical_fields  — the 10 fields the model must return, per scope
#   * pnl_anchors       — distinctive P&L row labels used to LOCATE the P&L page
#                         in the cheap text pre-pass (so we render the right pages)
#   * units_hints       — source-unit phrase -> multiplier to crore
#   * validations       — accounting identities; failures downgrade confidence

# The canonical schema (also the keys in tests/.../ground_truth/*.yaml).
# eps_* are per-share rupees and are never unit-converted.
canonical_fields:
  - revenue_cr
  - other_income_cr
  - total_income_cr
  - total_expenses_cr
  - pbt_cr
  - tax_cr
  - pat_cr
  - total_comprehensive_income_cr
  - eps_basic
  - eps_diluted

rupee_fields:
  - eps_basic
  - eps_diluted

# Used to find the page(s) holding the Statement of Profit & Loss. Matched as
# lowercase substrings against each page's text. A page hitting >= 2 of these is
# a P&L candidate.
pnl_anchors:
  - "revenue from operations"
  - "income from operations"
  - "total income"
  - "total expenses"
  - "total expenditure"        # banks
  - "profit before tax"
  - "before tax"               # banks ("...Ordinary Activities before Tax")
  - "profit after tax"
  - "after tax"                # banks
  - "profit for the period"
  - "net profit"               # banks
  - "tax expense"
  - "total comprehensive income"
  - "earnings per"
  - "earning per"              # some banks print "Earning per Share"
  - "interest earned"          # banks/NBFCs
  - "interest expended"        # banks
  - "operating profit"         # banks
  - "net interest income"

# Source-unit phrase -> factor to crore. Checked as substrings, most specific
# first. EPS is never scaled.
units_hints:
  - {phrase: "in crore",   factor: 1.0}
  - {phrase: "in crores",  factor: 1.0}
  - {phrase: "₹ in cr",    factor: 1.0}
  - {phrase: "rs. in cr",  factor: 1.0}
  - {phrase: "in million", factor: 0.1}
  - {phrase: "in millions", factor: 0.1}
  - {phrase: "in lakh",    factor: 0.01}
  - {phrase: "in lakhs",   factor: 0.01}
  - {phrase: "in lacs",    factor: 0.01}
  - {phrase: "in thousand", factor: 0.0001}
  - {phrase: "in thousands", factor: 0.0001}

# Accounting identities. Failures DOWNGRADE confidence, they don't reject. Each
# rule is eval'd with the standalone *_cr fields in scope (abs available).
validations:
  - rule: "revenue_cr > 0"
    message: "Revenue should be positive"
  - rule: "abs(pat_cr) < abs(revenue_cr) * 1.5"
    message: "PAT magnitude exceeds revenue — likely wrong row/column"
  - rule: "abs(total_income_cr - (revenue_cr + other_income_cr)) < abs(total_income_cr) * 0.05"
    message: "Total income != revenue + other_income (within 5%)"
  - rule: "abs(pbt_cr - (total_income_cr - total_expenses_cr)) < abs(pbt_cr) * 0.10 + 0.25"
    message: "PBT != total_income - total_expenses (within 10%)"
  - rule: "abs((pbt_cr - tax_cr) - pat_cr) < abs(pat_cr) * 0.10 + 0.25"
    message: "PBT - tax != PAT (within 10%)"
