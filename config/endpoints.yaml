endpoints:
  announcements_equity:
    collector: nse_data.collectors.announcements:Announcements
    url: /api/corporate-announcements
    params:
      index: equities
    referer: https://www.nseindia.com/companies-listing/corporate-filings-announcements
    response: json
    cadence: 5m
    active_hours: "08:00-19:00"
    table: raw_announcements
    enabled: true

  announcements_sme:
    collector: nse_data.collectors.announcements:SmeAnnouncements
    url: /api/corporate-announcements
    params:
      index: sme
    referer: https://www.nseindia.com/companies-listing/corporate-filings-announcements
    response: json
    cadence: 10m
    active_hours: "08:00-19:00"
    table: raw_announcements
    enabled: true

  announcements_debt:
    collector: nse_data.collectors.announcements:DebtAnnouncements
    url: /api/corporate-announcements
    params:
      index: debt
    referer: https://www.nseindia.com/companies-listing/corporate-filings-announcements
    response: json
    cadence: 30m
    active_hours: "08:00-19:00"
    table: raw_nonequity_announcements
    enabled: true

  announcements_mf:
    collector: nse_data.collectors.announcements:MfAnnouncements
    url: /api/corporate-announcements
    params:
      index: mf
    referer: https://www.nseindia.com/companies-listing/corporate-filings-announcements
    response: json
    cadence: 1h
    active_hours: "08:00-19:00"
    table: raw_nonequity_announcements
    enabled: true

  oi_spurts:
    collector: nse_data.collectors.oi_spurts:OiSpurts
    url: /api/live-analysis-oi-spurts-underlyings
    referer: https://www.nseindia.com/market-data/oi-spurts
    response: json
    cadence: 5m
    market_hours_only: true
    table: raw_oi_spurts
    enabled: true

  bhavcopy_cm:
    collector: nse_data.collectors.bhavcopy:Bhavcopy
    response: csv
    cadence: daily
    run_at: "18:00"
    table: raw_bhavcopy_cm
    enabled: true

  surveillance_gsm:
    collector: nse_data.collectors.surveillance:GsmSurveillance
    url: /api/reportGSM
    referer: https://www.nseindia.com/market-data/price-bands-surveillance-actions
    response: json
    cadence: daily
    run_at: "20:00"
    table: raw_surveillance_gsm
    enabled: true

  surveillance_asm_lt:
    collector: nse_data.collectors.surveillance:AsmLongTermSurveillance
    url: /api/reportASM
    referer: https://www.nseindia.com/market-data/price-bands-surveillance-actions
    response: json
    cadence: daily
    run_at: "20:05"          # 5 min later, stagger to be polite to NSE
    table: raw_surveillance_asm_lt
    enabled: true

  surveillance_asm_st:
    collector: nse_data.collectors.surveillance:AsmShortTermSurveillance
    url: /api/reportASM
    referer: https://www.nseindia.com/market-data/price-bands-surveillance-actions
    response: json
    cadence: daily
    run_at: "20:10"
    table: raw_surveillance_asm_st
    enabled: true

  price_bands:
    collector: nse_data.collectors.price_band_master:PriceBandMaster
    url: https://nsearchives.nseindia.com/content/equities/sec_list.csv
    referer: https://www.nseindia.com/market-data/price-bands-surveillance-actions
    response: text
    cadence: daily
    run_at: "08:45"          # before open; bands apply to today's session
    trading_day_only: true
    table: raw_price_bands
    enabled: true

  unsolicited_watchlist:
    collector: nse_data.collectors.unsolicited:UnsolicitedWatchlist
    url: https://nsearchives.nseindia.com/web/sites/default/files/inline-files/Current_list_of_symbols_1.xlsx
    referer: https://www.nseindia.com/static/regulations/unsolicited-messages-report
    response: bytes
    cadence: daily
    run_at: "20:15"          # after GSM/ASM surveillance pulls
    trading_day_only: true
    table: raw_unsolicited_watchlist
    enabled: true

  option_chain:
    collector: nse_data.collectors.option_chain:OptionChain
    response: json
    cadence: 5m
    market_hours_only: true
    table: raw_option_chain
    enabled: true

  live_equity_nifty50:
      collector: nse_data.collectors.live_equity:LiveEquity
      response: json
      cadence: 5m
      market_hours_only: true
      table: raw_equity_quotes
      enabled: true
      # The collector defaults to NIFTY 50. To poll more indices, copy this
      # entry and subclass LiveEquity with a different index_name.

  indices:
    collector: nse_data.collectors.indices:Indices
    response: json
    cadence: 5m
    market_hours_only: true
    table: raw_indices
    enabled: true

  gainers:
    collector: nse_data.collectors.market_movers:Gainers
    response: json
    cadence: 5m
    market_hours_only: true
    table: raw_market_movers
    enabled: true

  losers:
    collector: nse_data.collectors.market_movers:Losers
    response: json
    cadence: 5m
    market_hours_only: true
    table: raw_market_movers
    enabled: true

  most_active_volume:
    collector: nse_data.collectors.most_active:MostActiveByVolume
    response: json
    cadence: 5m
    market_hours_only: true
    table: raw_most_active
    enabled: true

  most_active_value:
    collector: nse_data.collectors.most_active:MostActiveByValue
    response: json
    cadence: 5m
    market_hours_only: true
    table: raw_most_active
    enabled: true

  high_52w:
      collector: nse_data.collectors.high_low_52w:High52W
      response: json
      cadence: 10m
      market_hours_only: true
      table: raw_high_low_52w
      enabled: true

  low_52w:
    collector: nse_data.collectors.high_low_52w:Low52W
    response: json
    cadence: 10m
    market_hours_only: true
    table: raw_high_low_52w
    enabled: true

  price_band_upper:
    collector: nse_data.collectors.price_band:UpperBandHits
    response: json
    cadence: 3m
    market_hours_only: true
    table: raw_band_hits
    enabled: true

  price_band_lower:
    collector: nse_data.collectors.price_band:LowerBandHits
    response: json
    cadence: 3m
    market_hours_only: true
    table: raw_band_hits
    enabled: true

  pre_open:
    collector: nse_data.collectors.pre_open:PreOpen
    url: /api/market-data-pre-open
    params:
      key: ALL
    referer: https://www.nseindia.com/market-data/pre-open-market-cm-and-emerge-market
    response: json
    cadence: daily
    run_at: "09:08"          # one-shot; pre-open book settles 09:00–09:15 IST
    trading_day_only: true   # daily cron fires every day; gate skips holidays/weekends
    table: raw_pre_open
    enabled: true

  call_auction:
    collector: nse_data.collectors.call_auction:CallAuction
    url: /api/live-watch-call-auction
    referer: https://www.nseindia.com/market-data/stocks-in-call-auction
    response: json
    cadence: daily
    run_at: "15:45"          # after the day's six call-auction sessions close
    trading_day_only: true
    table: raw_call_auction
    enabled: true

  most_active_fno_volume:
    collector: nse_data.collectors.most_active_fno:MostActiveFnoByVolume
    response: json
    cadence: 5m
    market_hours_only: true
    table: raw_most_active_fno
    enabled: true

  most_active_fno_value:
    collector: nse_data.collectors.most_active_fno:MostActiveFnoByValue
    response: json
    cadence: 5m
    market_hours_only: true
    table: raw_most_active_fno
    enabled: true

  board_meetings:
      collector: nse_data.collectors.board_meetings:BoardMeetings
      response: json
      cadence: 30m
      active_hours: "08:00-19:00"
      table: raw_board_meetings
      enabled: true

  corporate_actions:
    collector: nse_data.collectors.corporate_actions:CorporateActions
    response: json
    cadence: 1h
    active_hours: "08:00-19:00"
    table: raw_corporate_actions
    enabled: true

  financial_results:
    collector: nse_data.collectors.financial_results:FinancialResults
    response: json
    cadence: 1h
    active_hours: "08:00-19:00"
    table: raw_financial_results
    enabled: true

  large_deals:
    collector: nse_data.collectors.large_deals:LargeDeals
    response: json
    cadence: 30m
    active_hours: "08:00-19:00"
    table: raw_large_deals
    enabled: true

  insider_trading:
    collector: nse_data.collectors.insider_trading:InsiderTrading
    response: json
    cadence: 1h
    active_hours: "08:00-19:00"
    table: raw_insider_trading
    enabled: true

  integrated_filings:
    collector: nse_data.collectors.integrated_filings:IntegratedFilings
    url: /api/integrated-filing-results
    referer: https://www.nseindia.com/companies-listing/corporate-filings-integrated-filing
    response: json
    cadence: weekly
    run_at: "Sun 08:00"
    table: raw_integrated_filings
    enabled: true

  bhavcopy_fo:
      collector: nse_data.collectors.bhavcopy_fo:BhavcopyFO
      response: bytes
      cadence: daily
      run_at: "18:00"
      table: raw_bhavcopy_fo
      enabled: true

  volatility_report:
    collector: nse_data.collectors.volatility_report:VolatilityReport
    response: text
    cadence: daily
    run_at: "18:30"
    table: raw_volatility
    enabled: true

  fii_dii:
    collector: nse_data.collectors.fii_dii:FiiDii
    response: json
    cadence: daily
    run_at: "19:00"
    table: raw_fii_dii
    enabled: true

  macro:
    collector: nse_data.collectors.macro:MacroCollector
    response: json        # informational; collector fetches Yahoo via httpx, not the NSE session
    cadence: daily
    run_at: "18:00"       # global/macro — intentionally NOT trading_day_only (matters on NSE holidays)
    table: raw_macro
    enabled: true

  fno_list:
      collector: nse_data.collectors.fno_list:FnoList
      response: json
      cadence: weekly
      run_at: "Sun 06:00"
      table: raw_fno_list
      enabled: true

  index_members:
    collector: nse_data.collectors.index_members:IndexMembers
    response: json
    cadence: weekly
    run_at: "Sun 06:30"
    table: raw_index_members
    enabled: true

  new_listings:
    collector: nse_data.collectors.new_listings:NewListings
    response: json
    cadence: daily
    run_at: "09:00"
    table: raw_new_listings
    enabled: true

  primary_market:
    collector: nse_data.collectors.primary_market:PrimaryMarket
    response: json
    cadence: daily
    run_at: "07:00"
    table: raw_primary_issues
    enabled: true

  quote_metadata:
    collector: nse_data.collectors.quote_metadata:QuoteMetadata
    response: json
    cadence: weekly
    run_at: "Sun 07:00"
    table: raw_quote_metadata
    enabled: true

  shareholding_pattern:
    collector: nse_data.collectors.shareholding:ShareholdingPattern
    url: /api/corporate-share-holdings-master
    referer: https://www.nseindia.com/companies-listing/corporate-filings-shareholding-pattern
    response: json
    cadence: weekly
    run_at: "Sun 07:30"
    table: raw_shareholding_pattern
    enabled: true

  pdf_parser:
      collector: nse_data.parsers.job:ParserJob
      cadence: 10m
      active_hours: "08:00-19:30"
      enabled: false   # leave disabled for Phase 2 backfill; flip after testing