# PDF classifier configuration.
# See src/nse_data/parsers/pdf_classifier.py for usage.

classifier:
  sample_pages: 3
  max_seconds_per_pdf: 2.0

  thresholds:
    # Scanned detection
    scanned_chars_max: 100             # avg chars/page below this = scanned
    scanned_word_validity_min: 0.5     # fraction of tokens that look like words

    # Presentation detection
    presentation_aspect_min: 1.3       # width/height ratio (landscape)

    # Hybrid detection (portrait + heavy images + has text)
    hybrid_image_ratio_min: 0.3       # image area / page area lower bound
    hybrid_image_ratio_max: 0.7        # upper bound; above this it's scanned-ish
    hybrid_chars_min: 500              # must have at least this much text

  # When classification takes longer than max_seconds_per_pdf:
  #   "log_and_classify_as_unknown"  — proceed with best-effort, warn
  #   "fail"                         — raise an exception (not currently impl)
  timeout_action: log_and_classify_as_unknown