<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSE Data Service — LLM Spend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/llm.css">
</head>
<body>
  <header>
    <h1>LLM Spend</h1>
    <span class="meta" id="meta">loading…</span>
    <div class="hdr-right">
      <a class="link" href="/">Health →</a>
      <a class="link" href="/earnings">Earnings →</a>
      <button class="icon" id="themeBtn" title="Toggle light/dark">☀</button>
    </div>
  </header>

  <div class="cards">
    <div class="card">
      <div class="label">Today</div>
      <div class="big" id="today">—</div>
      <div class="capbar"><div class="fill" id="capFill"></div></div>
      <div class="sub" id="capNote">—</div>
    </div>
    <div class="card">
      <div class="label">This month</div>
      <div class="big" id="month">—</div>
      <div class="sub" id="monthNote">—</div>
    </div>
    <div class="card">
      <div class="label">All time</div>
      <div class="big" id="total">—</div>
      <div class="sub" id="totalNote">—</div>
    </div>
  </div>

  <section>
    <h2>Last 30 days</h2>
    <div class="bars" id="bars"></div>
  </section>

  <div class="cols">
    <section>
      <h2>Daily</h2>
      <table><thead><tr><th>Date</th><th class="num">USD</th><th class="num">% of cap</th></tr></thead>
        <tbody id="dailyRows"></tbody></table>
    </section>
    <section>
      <h2>Monthly</h2>
      <table><thead><tr><th>Month</th><th class="num">USD</th><th class="num">avg/day</th></tr></thead>
        <tbody id="monthlyRows"></tbody></table>
    </section>
  </div>

  <div class="footer">Spend is recorded per gpt-4o call (P&amp;L vision · narrative · deck vision · consensus has no LLM cost) · auto-refreshes every 60s · <a class="tbl" href="/api/llm/spend">/api/llm/spend</a></div>
  <script type="module" src="/static/js/pages/llm.js"></script>
</body>
</html>
