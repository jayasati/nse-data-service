<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Rankings — NSE Data Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/backtest.css">
<style>
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  .segbtn { padding:4px 10px; border-radius:6px; border:1px solid var(--border,#333); background:transparent;
            color:inherit; cursor:pointer; font-size:13px; }
  .segbtn.on { background:var(--accent,#3b82f6); color:#fff; border-color:transparent; }
  tr.basket { background:rgba(59,130,246,.10); }
  tr.excluded td { opacity:.45; text-decoration:line-through; }
  .flag { display:inline-block; padding:1px 6px; margin:0 2px 2px 0; border-radius:4px; font-size:11px;
          background:rgba(255,255,255,.08); }
  .flag.good { background:rgba(22,163,74,.22); } .flag.bad { background:rgba(220,38,38,.22); }
  td.pos { color:#16a34a; } td.neg { color:#dc2626; }
</style>
</head>
<body>
  <header>
    <h1>Weekly Rankings</h1>
    <span class="meta" id="meta">loading…</span>
    <div class="hdr-right">
      <select id="weekPicker" class="picker"></select>
    </div>
  </header>

  <div class="toolbar">
    <button class="segbtn on" id="viewBasket">Basket (sized)</button>
    <button class="segbtn" id="viewAll">All candidates</button>
    <span class="meta" id="summary"></span>
  </div>

  <div class="tablewrap">
    <table id="rankTable">
      <thead><tr>
        <th class="num">#</th><th>Symbol</th><th>Sector</th><th class="num">Lean</th>
        <th class="num">Adj</th><th>Slow-data flags</th><th class="num">Pledge Δ</th>
        <th class="num">FII Δ</th><th class="num">Deliv</th><th class="num">Entry</th>
        <th class="num">Stop</th><th class="num">Qty</th><th class="num">Risk ₹</th>
      </tr></thead>
      <tbody id="rankBody"></tbody>
    </table>
  </div>

  <div class="footer">
    Weekly positional book — validated Lean rank + slow-data overlay, ATR-sized. Snapshots each
    Monday 09:00 IST; the basket is paper-traded forward. <code>scripts/weekly_positional.py</code>
  </div>

  <script type="module" src="/static/js/components/nav.js"></script>
  <script type="module" src="/static/js/pages/rankings.js"></script>
</body>
</html>
